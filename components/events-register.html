<div class="card" style="max-width: 640px; margin: 0 auto;">
  <div class="section-title">Register Contact for Event</div>
  <form id="event-registration-form" onsubmit="handleEventRegistration(event)">
    <div class="form-group" style="position: relative;">
      <label class="form-label" for="event-reg-contact-search">Search Contact</label>
      <input type="text" class="form-input" id="event-reg-contact-search" placeholder="Type contact name..." oninput="handleRegContactSearch(this.value)">
      <input type="hidden" id="event-reg-contact-id" value="">
      <div id="reg-contact-autocomplete" style="position: absolute; top: 100%; left: 0; right: 0; z-index: 100; background-color: var(--color-background-surface); border: 1px solid var(--color-border); border-radius: var(--radius-inner); max-height: 200px; overflow-y: auto;"></div>
    </div>
    
    <div class="form-group">
      <label class="form-label" for="select-reg-event">Campaign Event</label>
      <select class="form-select" id="select-reg-event" required>
        <option value="gac_dinner">GAC 2023 Dinner Attendance</option>
        <option value="symwest_booth">SymWest 2026 Booth Visitors</option>
        <option value="executive_meetup">Credit Union Executive Meetup (Enriched)</option>
      </select>
    </div>
    
    <div class="form-group">
      <label class="form-label" for="input-reg-status">Registration Status</label>
      <select class="form-select" id="input-reg-status">
        <option value="Attended">Attended</option>
        <option value="Registered">Registered</option>
        <option value="Invited">Invited</option>
        <option value="Cancelled">Cancelled</option>
      </select>
    </div>
    
    <div class="form-group">
      <label class="form-label" for="input-reg-notes">Event Notes</label>
      <textarea class="form-input" id="input-reg-notes" rows="3" placeholder="Add specific notes (e.g. table number, topics discussed...)"></textarea>
    </div>
    
    <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
      <button type="submit" class="btn btn-primary">Confirm Registration</button>
    </div>
  </form>
</div>
