<div class="table-container">
  <div class="table-toolbar">
    <div style="flex: 1; max-width: 360px;">
      <input type="text" class="form-input" id="influencers-search-input" placeholder="Search influencers by name or company..." oninput="filterInfluencersTable()">
    </div>
    <div style="display: flex; gap: 0.75rem; align-items: center;">
      <select class="form-select" id="filter-lead-temp" onchange="filterInfluencersTable()">
        <option value="">All Lead Temps</option>
        <option value="Hot Lead">Hot Leads</option>
        <option value="Cold Lead">Cold Leads</option>
      </select>
      <select class="form-select" id="filter-influencer-match" onchange="filterInfluencersTable()">
        <option value="">All Match %</option>
        <option value="high">High (&gt;90%)</option>
        <option value="medium">Medium (80-90%)</option>
        <option value="low">Low (&lt;80%)</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="openAddInfluencerModal()">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Add Influencer
      </button>
    </div>
  </div>
  <div style="overflow-x: auto;">
    <table class="data-table" id="table-influencers">
      <thead>
        <tr>
          <th>Name</th>
          <th>Job Title</th>
          <th>Company Name</th>
          <th>Lead Status</th>
          <th>Match Score</th>
          <th>Referrals &amp; Credits</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="table-influencers-body">
        <tr><td colspan="7" style="text-align: center; padding: 2rem; color: var(--color-text-disabled);">No influencers found. Please load CSV data or click "Add Influencer" above.</td></tr>
      </tbody>
    </table>
  </div>
  <div class="pagination-bar" id="influencers-pagination"></div>
</div>
