          <div class="schedule-split-layout" style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; min-height: 500px;">
            
            <div class="table-container-card" style="margin-top: 0; padding: 20px;">
              <div class="calendar-header-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 id="calendar-month-year" style="font-size: 16px; margin: 0; font-weight: 700;">July 2026</h3>
                <div style="display: flex; gap: 8px;">
                  <button class="btn btn-secondary btn-sm" onclick="changeCalendarMonth(-1)" style="height: 32px; padding: 0 10px;">Previous</button>

                </div>

              <div class="calendar-grid-days-header" style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 8px; border-bottom: 1.5px solid var(--primary); padding-bottom: 4px;">

              </div>
            </div>
            
            <div class="table-container-card" style="margin-top: 0; padding: 20px; display: flex; flex-direction: column;">

              <div id="selected-date-meetings-list" class="meetings-grid" style="flex-grow: 1; overflow-y: auto;">

              </div>
            </div>
