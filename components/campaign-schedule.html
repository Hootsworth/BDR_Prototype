<div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 1.5rem; min-height: 500px;">
  <div class="card" style="margin: 0;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--color-border);">
      <h3 id="calendar-month-year" style="font-family: var(--font-family-heading); font-size: var(--font-size-base); font-weight: 700; margin: 0;">July 2026</h3>
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn btn-secondary btn-sm" onclick="changeCalendarMonth(-1)">Previous</button>
        <button class="btn btn-secondary btn-sm" onclick="changeCalendarMonth(1)">Next</button>
      </div>
    </div>
    
    <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: var(--font-size-xs); font-weight: 700; color: var(--color-text-secondary); margin-bottom: 0.5rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.25rem;">
      <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
    </div>
    
    <div id="calendar-days-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem;">
      <!-- Days populated dynamically by renderCalendar() -->
    </div>
  </div>

  <div class="card" style="margin: 0; display: flex; flex-direction: column;">
    <div style="margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--color-border);">
      <h3 id="selected-date-title" style="font-family: var(--font-family-heading); font-size: var(--font-size-base); font-weight: 700; margin: 0;">No Date Selected</h3>
      <p id="selected-date-subtitle" style="font-size: var(--font-size-xs); color: var(--color-text-secondary); margin: 0.25rem 0 0 0;">
        Select a highlighted date to view briefings.
      </p>
    </div>
    <div id="selected-date-meetings-list" style="flex: 1; overflow-y: auto;">
      <div style="font-size: var(--font-size-xs); color: var(--color-text-disabled); text-align: center; padding: 3rem 0;">Select a date on the calendar grid to inspect briefing details.</div>
    </div>
  </div>
</div>
